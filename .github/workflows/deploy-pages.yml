# Builds the static website (frontend/) and publishes it with GitHub Pages.
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Check that the exported data is present
        run: test -f frontend/public/data/filters/cipic_165_44100.ssfp || (echo "Run 'python -m sonicsphere.export_static' in backend/ and commit frontend/public/data" && exit 1)
      - name: Build
        working-directory: frontend
        run: |
          # User/organisation sites (<name>.github.io) live at "/", project sites at "/<repo>/".
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then BASE="/"; else BASE="/${{ github.event.repository.name }}/"; fi
          VITE_BASE="$BASE" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
